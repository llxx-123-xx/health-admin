server:
  port: 1237 # 你的后端端口

spring:
  application:
    name: ai-springboot

  mail:
    host: smtp.qq.com
    port: 465
    # 💡 改成环境变量占位符
    username: ${MAIL_USERNAME:3525902928@qq.com}
    password: ${MAIL_PASSWORD:pwgwojuzwyrfdbai}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/health_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    # 💡 改成环境变量占位符
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring Boot 3.x 的 Redis 配置
  data:
    redis:
      host: 127.0.0.1      # Redis 服务器地址
      port: 6379           # Redis 端口 (默认 6379)
      password:            # 如果你的本地 Redis 没有密码，这里留空即可
      database: 0          # 使用的数据库索引 (默认 0)
      timeout: 5000ms      # 连接超时时间
      lettuce:
        pool:
          max-active: 8    # 连接池最大连接数
          max-idle: 8      # 最大空闲连接
          min-idle: 0      # 最小空闲连接
          max-wait: -1ms   # 获取连接的最大等待时间（-1表示无限等待）

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true

jwt:
  # 💡 改成环境变量占位符
  secret: ${JWT_SECRET:your-secret-key-1234567890}
  expiration: 86400000